<!doctype html>
<html lang="pt_br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formulario 2</title>
  </head>
  <body>
    <form action="" method="post">
      <fieldset>
        <label for="name">nome:</label>
        <input type="text" name="nome" id="nome" required /><br />

        <label for="email">email:</label>
        <input type="email" name="email" id="email" required /> <br />

        <label for="numero">numero:</label>
        <input type="number" name="numero" id="numero" required /><br />

        <label for="senha">senha</label>
        <input
          type="password"
          name="senha"
          id="senha"
          required
          minlength="4"
          maxlength="15"
        />
        <p>
          <input type="submit" value="enviar" />
          <input type="submit" value="limpar" />
        </p>
        <label for="check">aceitar termos</label>
        <input type="checkbox" name="check" id="check" /> <br />

        <label for="contap"> conta pessoal</label>
        <input type="radio" name="conta" id="contap" />sim

        <label for="contat"></label>
        <input type="radio" name="conta" id="contat" />não
      </fieldset>
    </form>
  </body>
</html>
